name: Core and real-file interoperability
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install official MoonBit toolchain
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            pwsh -NoProfile -Command "irm https://cli.moonbitlang.com/install/powershell.ps1 | iex"
            echo "$USERPROFILE/.moon/bin" >> "$GITHUB_PATH"
          else
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
            echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          fi
      - name: Format interfaces and both backends
        shell: bash
        run: |
          moon version --all
          moon update
          moon fmt --check
          moon info
          git diff --exit-code -- '*.mbti'
          moon check --target wasm-gc --deny-warn
          moon test --target wasm-gc --deny-warn
          moon test --target js --deny-warn
          moon build --target js --release --deny-warn
          node scripts/swarmcrate.mjs help
          node scripts/demo.mjs
          node scripts/benchmark.mjs --runs 1
          python scripts/source_audit.py
      - name: Independent interoperability and real-file scenarios
        run: |
          python -m pip install libtorrent==2.1.1 torf==4.3.1
          python scripts/interop.py --cli _build/js/release/build/cmd/main/main.js
